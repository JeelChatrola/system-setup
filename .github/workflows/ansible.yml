---
name: Ansible

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  containers:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'debian:12', 'debian:13', 'archlinux:base']
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install pinned Ansible tooling
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r ansible/requirements.txt
          .venv/bin/ansible-galaxy collection install -r ansible/requirements.yml
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Validate playbooks
        run: |
          yamllint ansible tests/ansible .github/workflows/ansible.yml
          ansible-lint --offline ansible/site.yml tests/ansible/*.yml
          ansible-playbook -i ansible/inventory.ini ansible/site.yml --syntax-check

      - name: Test installation and idempotency in containers
        env:
          TEST_DESKTOP: '1'
        run: bash tests/ansible/run.sh '${{ matrix.image }}'
