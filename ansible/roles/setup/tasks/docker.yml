---
- name: Configure official Docker repository on Debian family
  ansible.builtin.include_tasks: repository.yml
  vars:
    setup_repository:
      name: docker
      uri: "https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}"
      suites: "{{ ansible_facts.distribution_release }}"
      components: [stable]
      key_url: "https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}/gpg"
      fingerprint: 9DC858229FC7DD38854AE2D88D81803C0EBFCD88
  when: setup_backend == 'Debian'

- name: Install Docker Engine and Compose
  ansible.builtin.include_tasks: packages.yml
  vars:
    setup_package_names: "{{ setup_packages.docker }}"

- name: Enable and start Docker
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
  when: setup_manage_services | bool

- name: Add explicitly requested Docker group membership
  ansible.builtin.user:
    name: "{{ setup_user }}"
    groups: docker
    append: true
  when: setup_docker_group | bool

- name: Verify Docker daemon
  ansible.builtin.command: docker info
  changed_when: false
  when: setup_manage_services | bool and not ansible_check_mode
